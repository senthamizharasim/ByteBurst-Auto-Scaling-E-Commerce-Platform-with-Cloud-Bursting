apiVersion: apps/v1
kind: Deployment
metadata:
  name: byteburst-backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: byteburst-backend
  template:
    metadata:
      labels:
        app: byteburst-backend
    spec:
      containers:
      - name: byteburst-backend
        image: byteburst-backend
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: byteburst-backend-service
spec:
  type: NodePort
  selector:
    app: byteburst-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001