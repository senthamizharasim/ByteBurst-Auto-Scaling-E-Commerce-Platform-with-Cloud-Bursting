apiVersion: apps/v1
kind: Deployment
metadata:
  name: byteburst-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: byteburst-frontend
  template:
    metadata:
      labels:
        app: byteburst-frontend
    spec:
      containers:
      - name: byteburst-frontend
        image: byteburst-frontend:v9
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: byteburst-frontend-service
spec:
  type: NodePort
  selector:
    app: byteburst-frontend
  ports:
    - port: 80
      targetPort: 80